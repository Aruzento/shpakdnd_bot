# Administrator-owned /etc/ssh/sshd_config.d/90-shpakdnd-staging.conf
Match User staging-deploy
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile /etc/ssh/authorized_keys/staging-deploy
    ForceCommand /usr/bin/python3 -I /usr/local/lib/shpakdnd-staging/ssh_entry.py
    DisableForwarding yes
    PermitTTY no
    PermitUserRC no
    PermitUserEnvironment no
    MaxSessions 1
Match all
