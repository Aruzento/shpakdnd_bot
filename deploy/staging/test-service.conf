# TEST ONLY. Install as shpakdnd-bot.service.d/90-staging.conf after approved setup.
[Service]
Type=simple
User=shpakbot
Group=shpakbot
SupplementaryGroups=
DynamicUser=no
WorkingDirectory=/opt/shpakdnd-staging/current
ExecStart=
ExecStart=/opt/shpakdnd-staging/venv/bin/python bot.py
ExecCondition=
ExecStartPre=
ExecStartPost=
ExecReload=
ExecStop=
ExecStopPost=
Environment=
EnvironmentFile=
EnvironmentFile=/etc/shpakdnd-staging/runtime.env
PassEnvironment=
UnsetEnvironment=
PAMName=
LoadCredential=
LoadCredentialEncrypted=
ImportCredential=
SetCredential=
SetCredentialEncrypted=
UMask=0077
Restart=on-failure
ProtectSystem=strict
ReadWritePaths=
ReadWritePaths=/var/lib/shpakdnd-staging/data
ReadOnlyPaths=
InaccessiblePaths=
BindPaths=
BindReadOnlyPaths=
TemporaryFileSystem=
RootDirectory=
RootImage=
StateDirectory=
CacheDirectory=
LogsDirectory=
RuntimeDirectory=
ConfigurationDirectory=
ExecSearchPath=
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
NoNewPrivileges=yes
RestrictSUIDSGID=yes
CapabilityBoundingSet=
AmbientCapabilities=
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictAddressFamilies=
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
TasksMax=256
MemoryMax=3G
CPUQuota=200%
TimeoutStopSec=30
KillMode=control-group
Delegate=no
