# Applied to the EXISTING TEST bot only, after operator inventory/backup and explicit setup approval.
[Service]
User=shpakbot
Group=shpakbot
WorkingDirectory=/opt/shpakdnd-staging/current
ExecStart=
ExecStart=/opt/shpakdnd-staging/venv/bin/python bot.py
EnvironmentFile=/etc/shpakdnd-staging/runtime.env
UMask=0077
Restart=on-failure
ProtectSystem=strict
ReadWritePaths=/var/lib/shpakdnd-staging/data
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
NoNewPrivileges=yes
RestrictSUIDSGID=yes
CapabilityBoundingSet=
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
