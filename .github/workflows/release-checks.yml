name: Release checks

on:
  push:
    branches: ['main', 'codex/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-checks:
    name: Linux release checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BOT_TOKEN: ci-test-token
      PYTHONUTF8: '1'
    steps:
      - name: Checkout complete history
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Python 3.13
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install project dependencies
        id: dependencies
        run: python -m pip install -r requirements.txt
      - name: Stable release preservation and disposable checks
        id: checks
        run: python scripts/release_checks.py --report "$RUNNER_TEMP/release-checks.json"
      - name: Automatic read-only semantic smoke
        run: sudo -E "$(which python)" scripts/semantic_smoke_ci.py
      - name: Job summary
        if: always()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
        run: |
          if [ -f scripts/release_checks.py ]; then
            python scripts/release_checks.py --report "$RUNNER_TEMP/release-checks.json" --summary "$GITHUB_STEP_SUMMARY"
          else
            printf '## Release checks\n\nCheckout: %s\nPython: %s\nDependencies: %s\nBaseline: f06c0d129fdad0fef4fde0889915faac26b94f4a\nHEAD: %s\nGuard / validators / tests: NOT RUN\n' "$CHECKOUT_OUTCOME" "$PYTHON_OUTCOME" "$DEPENDENCIES_OUTCOME" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          fi
