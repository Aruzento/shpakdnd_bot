name: Isolated systemd staging
on:
  push:
    branches: ['main', 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: systemd-staging-${{ github.ref }}
  cancel-in-progress: true
jobs:
  systemd-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Real systemd in disposable Linux namespace
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          docker build -t shpakdnd-systemd-stage -f deploy/ci-systemd/Dockerfile .
          trap 'docker logs shpakdnd-systemd-stage; docker rm -f shpakdnd-systemd-stage' EXIT
          docker run --privileged --detach --name shpakdnd-systemd-stage --cgroupns=private --tmpfs /run --tmpfs /run/lock --tmpfs /tmp --volume "$PWD:/source:ro" shpakdnd-systemd-stage
          docker exec shpakdnd-systemd-stage bash /source/deploy/ci-systemd/check.sh "$SOURCE_SHA"
  legacy-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BOT_TOKEN: ci-test-token
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python deploy/ci-systemd/legacy-check.py
